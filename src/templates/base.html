{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
      {% block page_title %}
        Django Container
      {% endblock page_title %}
    </title>
    <!-- Metadata -->
    <meta name="description" content="">
    <meta name="keywords" content="">
    <script>
      (function() {
        const theme = localStorage.getItem('theme') || 'system';
        const isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        // Apply the dark class to prevent FOUC
        if (theme === 'dark' || (theme === 'system' && isSystemDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        // Store the initial system preference
        localStorage.setItem('isSystemDark', isSystemDark);
        // Listen for system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (event) => {
          localStorage.setItem('isSystemDark', event.matches);
          if (theme === 'system') {
            document.documentElement.classList.toggle('dark', event.matches);
          }
        });
      })();
    </script>
    <!-- Styles -->
    <link rel="stylesheet" href="{% static "global.css" %}">
    <!-- Scripts -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.5/dist/cdn.min.js"></script>
  </head>
  <body>
    {% block layout %}
      <div class="h-screen flex flex-col items-center justify-center p-5">
        <h1 class="text-5xl text-center mb-4">
          This is template <code class="text-md-secondary">base.html</code>
        </h1>
        <h2 class="text-4xl text-center">
          Missing block
          <code class="text-md-error">
            {# djlint:off #}
            {% verbatim %}
              {%&nbsp;layout&nbsp;%}
            {% endverbatim %}
            {# djlint:on #}
          </code>
        </h2>
      </div>
    {% endblock layout %}
  </body>
</html>
