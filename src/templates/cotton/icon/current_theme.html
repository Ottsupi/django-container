<div x-data class="flex flex-row hover:cursor-pointer">
  <template x-if="$store.theme.current === 'dark'">
    <c-icon.moon class="{{ class }}" />
  </template>
  <template x-if="$store.theme.current === 'light'">
    <c-icon.sun class="{{ class }}" />
  </template>
  <template x-if="$store.theme.current === 'system'">
    <c-icon.sun-moon class="{{ class }}" />
  </template>
</div>
